apply plugin: 'com.android.application'

android {
    namespace = "com.gchunhwa2maker.moonlittarot"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gchunhwa2maker.moonlittarot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Values stay outside the repository. Never print or commit signing secrets.
    def signingValues = [
        store: System.getenv('MOONLIT_UPLOAD_STORE_FILE'),
        storePassword: System.getenv('MOONLIT_UPLOAD_STORE_PASSWORD'),
        alias: System.getenv('MOONLIT_UPLOAD_KEY_ALIAS'),
        keyPassword: System.getenv('MOONLIT_UPLOAD_KEY_PASSWORD')
    ]
    def signingReady = signingValues.values().every { it != null && !it.isEmpty() }
    def signingPartial = signingValues.values().any { it != null && !it.isEmpty() } && !signingReady
    if (signingPartial) {
        throw new GradleException('All four MOONLIT_UPLOAD signing variables are required when release signing is configured.')
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(signingValues.store)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }
    def ideSigningReady = ['android.injected.signing.store.file', 'android.injected.signing.store.password', 'android.injected.signing.key.alias', 'android.injected.signing.key.password'].every { project.hasProperty(it) && project.property(it) }
    gradle.taskGraph.whenReady { graph ->
        def buildsRelease = graph.allTasks.any { it.path == ':app:bundleRelease' || it.path == ':app:packageRelease' }
        if (buildsRelease && !signingReady && !ideSigningReady && !project.hasProperty('allowUnsignedReleaseValidation')) {
            throw new GradleException('Release signing is missing. Configure MOONLIT_UPLOAD_* variables; use -PallowUnsignedReleaseValidation only for local unsigned validation, never store submission.')
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
