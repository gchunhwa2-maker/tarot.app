name: Android build validation
on:
  workflow_dispatch:
  push:
    branches: [android-app]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build debug APK, unsigned validation AAB and lint
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease lintDebug -PallowUnsignedReleaseValidation --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: moonlit-android-validation-not-for-play-submission
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
